default_model: gold

# coal :    23M
# iron :    42M
# gold :    96M
# diamond : 135M

coal:
  VOCAB_SIZE: 28000
  MAX_LEN: 192
  EMBED_DIM: 384
  NUM_TRANSFORMER_BLOCKS: 6
  NUM_HEADS: 6
  NUM_KV_HEADS: 2
  MODEL_SAVE_PATH: "model/coal.weights.h5"
  BATCH_SIZE: 48
  PEAK_LEARNING_RATE: 0.0002
  generation:
    prompt: "おいしいオムライスを作るのに大事なことは"
    max_new_tokens: 60
    temperature: 0.7
    top_k: 40
    top_p: 0.8
    repetition_penalty: 1.4

